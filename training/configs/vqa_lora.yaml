model_id: "AdaptLLM/remote-sensing-Qwen2.5-VL-3B-Instruct"
output_dir: "training/checkpoints/satquery_vqa_lora"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "v_proj"

training:
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  num_train_epochs: 1
  warmup_ratio: 0.05
  weight_decay: 0.01
  bf16: true
  fp16: false
  gradient_checkpointing: true
  max_pixels: 65536
  min_pixels: 65536
  max_new_tokens: 100
  logging_steps: 2
  save_strategy: "epoch"
  seed: 42

data:
  train_data_path: "training/data/vqa_train.json"
  val_data_path: "training/data/vqa_val.json"
  benchmark_manifest_path: "data/benchmarks/rsvqa_lr/manifest.json"
